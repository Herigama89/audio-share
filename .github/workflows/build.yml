name: Build installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run the app's self-test
        shell: bash
        run: |
          set +e
          AUDIOSHARE_SELFTEST=1 xvfb-run -a npx electron . --no-sandbox > selftest.log 2>&1
          CODE=$?
          enc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          echo "::notice title=selftest::$(grep SELFTEST selftest.log | grep -v "console\[.*\]\[0\]" | head -120 | enc)"
          if [ $CODE -ne 0 ]; then echo "::warning title=log tail::$(tail -60 selftest.log | enc)"; fi
          exit $CODE

  build:
    needs: selftest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: dist/*.dmg
          - os: windows-latest
            script: dist:win
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build the DAW capture helper (Mac)
        if: runner.os == 'macOS'
        run: npm run build:native:mac

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Build the DAW capture helper (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist native\bin mkdir native\bin
          cl /nologo /O2 /EHsc /std:c++17 /DUNICODE /D_UNICODE native\win\daw-capture.cpp /Fo:native\bin\daw-capture.obj /Fe:native\bin\daw-capture.exe ole32.lib mmdevapi.lib

      - name: Test the DAW capture helper
        shell: bash
        run: |
          set +e
          BIN=native/bin/daw-capture; [ "$RUNNER_OS" = "Windows" ] && BIN=native/bin/daw-capture.exe
          LIST=$("$BIN" list); CODE=$?
          echo "::notice title=DAW helper list (${{ matrix.os }})::exit=$CODE output=$LIST"
          [ $CODE -eq 0 ] || exit 1
          echo "$LIST" | node -e "const j=JSON.parse(require('fs').readFileSync(0,'utf8')); if(!Array.isArray(j)&&!j.error) process.exit(1)" || exit 1
          # Try a real capture of a process that plays sound (may not work on a build machine with no speakers).
          if [ "$RUNNER_OS" = "macOS" ]; then
            afplay /System/Library/Sounds/Submarine.aiff & SND=$!; sleep 0.3
            ( "$BIN" capture $SND > cap.raw 2> cap.err & CP=$!; sleep 2; kill $CP ) 2>/dev/null
          else
            WPID=$(powershell -c '$p = Start-Process powershell -ArgumentList "-c","(New-Object Media.SoundPlayer C:\Windows\Media\tada.wav).PlaySync()" -PassThru -WindowStyle Hidden; $p.Id' | tr -d '\r')
            sleep 0.5
            ( "$BIN" capture $WPID > cap.raw 2> cap.err & CP=$!; sleep 2; kill $CP ) 2>/dev/null
          fi
          echo "::notice title=DAW helper capture (${{ matrix.os }})::stderr=$(tr '\n' ' ' < cap.err) bytes=$(wc -c < cap.raw)"
          exit 0

      - name: Set version
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Add the update key
        shell: bash
        env:
          TOKEN: ${{ secrets.UPDATE_TOKEN }}
        run: |
          node -e "require('fs').writeFileSync('update-token.json', JSON.stringify({ token: process.env.TOKEN || '' }))"
          if [ -z "$TOKEN" ]; then echo "::warning title=Updates::UPDATE_TOKEN secret is not set, so this build can't update itself."; fi

      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the packaged app
        shell: bash
        run: |
          RES=$(find dist -type d -name resources -path "*unpacked*" -o -type d -name Resources -path "*.app/Contents/Resources" | head -1)
          LIST=$(npx --yes @electron/asar list "$RES/app.asar")
          VENDOR=$(echo "$LIST" | grep -c "peerjs.min.js" || true)
          KEY=$(echo "$LIST" | grep -c "update-token.json" || true)
          NATIVE=$(find "$RES/app.asar.unpacked" -name "libnut.node" 2>/dev/null | grep -c . || true)
          HELPER=$(ls "$RES/native" 2>/dev/null | tr '\n' ' ')
          echo "::notice title=Package check (${{ matrix.os }})::peerjs=$VENDOR updatekey=$KEY controllibs=$NATIVE helper=$HELPER"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release the app updates from
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Audio Share 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/*.exe
            dist/*.dmg
