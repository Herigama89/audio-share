name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: dist/*.dmg
          - os: windows-latest
            script: dist:win
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the packaged app
        shell: bash
        run: |
          RES=$(find dist -type d -name resources -path "*unpacked*" -o -type d -name Resources -path "*.app/Contents/Resources" | head -1)
          echo "resources: $RES"
          VENDOR=$(npx --yes @electron/asar list "$RES/app.asar" | grep -c "peerjs.min.js" || true)
          NATIVE=$(find "$RES/app.asar.unpacked" -name "*.node" 2>/dev/null | tr '\n' ' ')
          echo "::notice title=Package check (${{ matrix.os }})::peerjs bundled=$VENDOR; native control libs: ${NATIVE:-NONE}"
          if [ "$RUNNER_OS" = "macOS" ]; then for f in $(find dist -path "*libnut-darwin*" -name libnut.node | tr " " "?"); do echo "::notice title=Mac control lib::$(file "${f//\?/ }" | sed 's/.*: //')"; done; fi
          ls -la dist

      - name: Keep installer as a build download
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}

      - name: Attach installer to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
